name: touch-monorepo

services:
  touch-client:
    build:
      context: .
      args:
        - GITHUB_TOKEN=${GITHUB_TOKEN}
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "4040:4040"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/production.sqlite.db
      - API_PORT=4040
      - CLIENT_PORT=3000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/client/node_modules
      - /app/apps/server/node_modules
      - /app/packages/core/node_modules
      - /app/packages/globals/node_modules
      - /app/packages/i18n/node_modules
      - /app/packages/purge-builds/node_modules
      - /app/packages/types/node_modules
      - /app/config/node_modules
